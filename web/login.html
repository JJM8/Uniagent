     wants a password and nothing else.

     needs a session), so it follows the browser's own light/dark preference and
     defaults to dark, which is what settings.json ships with. -->

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    /* The same stack index.html uses, so the two pages don't visibly change
       typeface as you go from the password box into the app. Geomini is a
       locally installed font rather than a bundled webfont, so on a device that
       hasn't got it BOTH pages fall back to sans-serif together - which is the
       point: they match either way. */
    font-family: "Geomini", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 340px;
  }
  /* The app header's mark and wordmark, same sizes, so the login page reads as
     the same product rather than a gate in front of one. */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  /* Fixed logo - it carries its own tile and green, so it does not follow the
     light/dark preference the rest of this page does. */
  .brand .logo { width: 28px; height: 28px; flex-shrink: 0;
                 background: var(--logo) center / contain no-repeat; }
  .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  p.sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  input {
    width: 100%;
    font: inherit;   /* matches the app, where every control inherits the body font */
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
  }
  input:focus { outline: none; border-color: var(--accent-pop); }
  input::placeholder { color: var(--dim); }
  button {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  /* Height is held even when empty, so submitting a wrong password doesn't
     make the form jump as the message appears. */
  #msg { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>UNIAGENT</h1>
  </div>
  <p class="sub">Enter your password to continue.</p>
  <!-- The username field is hidden but present: without one, mobile browsers
       and password managers will offer to remember the password but have
       nothing to file it under, and most then don't offer at all. -->
  <input type="text" name="username" value="uniagent" autocomplete="username"
         hidden>
  <input id="pw" type="password" name="password" autocomplete="current-password"
         placeholder="password" autofocus>
  <button id="go" type="submit">Unlock</button>
  <div id="msg"></div>
</form>
<script>
  const form = document.getElementById("f");
  const pw = document.getElementById("pw");
  const go = document.getElementById("go");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true;
    msg.textContent = "";
    try {
      const r = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: pw.value}),
      });
      if (r.ok) {
        // Where they were headed before the gate sent them here, if anywhere.
        const next = new URLSearchParams(location.search).get("next");
        location.replace(next && next.startsWith("/") ? next : "/");
        return;
      }
      const data = await r.json().catch(() => ({}));
      msg.textContent = data.error || "Wrong password.";
    } catch (err) {
      msg.textContent = "Could not reach the server.";
    }
    go.disabled = false;
    pw.select();
  });
</script>
</body>
</html>
